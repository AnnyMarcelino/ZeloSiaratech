<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/prebackend.css"><title>Espaço cuidador — Zelo</title><link rel="stylesheet" href="css/zelo-v2.css"><link rel="stylesheet" href="css/zelo-v3-overrides.css"><link rel="stylesheet" href="css/zelo-v5-contrast.css"></head><body data-role="cuidador"><header class="zelo-header"><a class="brand" href="index.html"><img class="zelo-logo-full exact-logo" src="assets/zelo-logo-exact.png" alt="Zelo — Tenha cuidado. Tenha zelo."></a><div class="header-actions"><a href="notificacoes.html" class="header-icon">🔔</a><a href="configuracoes.html" class="avatar">A</a></div></header><main class="main-content" style="margin-left:0"><section class="page-title compact"><span class="eyebrow">CUIDADO COMPARTILHADO</span><h1>Rotina de cuidados</h1><p>Informações liberadas apenas por vínculos autorizados.</p></section><section class="panel"><h2>Pessoas acompanhadas</h2><div id="people" class="patient-list"></div></section></main><script src="js/api.js"></script><script src="js/auth-guard.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{try{const p=await ZeloAPI.patients();document.getElementById('people').innerHTML=p.map(x=>`<a class="patient-row" href="historico.html?paciente_id=${x.id}"><span class="patient-avatar">${x.nome[0]}</span><span><b>${x.nome}</b><small>Acesso autorizado</small></span><span>›</span></a>`).join('')||'<p class="muted">Nenhum vínculo ativo. Solicite um vínculo nas configurações.</p>'}catch(e){document.getElementById('people').innerHTML=`<p>${e.message}</p>`}});</script><script src="js/ui.js"></script></body></html>
