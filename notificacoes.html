<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/data.css"><title>Central de cuidado — Zelo</title><link rel="stylesheet" href="css/zelo-v2.css"><link rel="stylesheet" href="css/zelo-v3-overrides.css"><link rel="stylesheet" href="css/zelo-v5-contrast.css"></head><body><main class="clinical-page"><a class="back-link" href="paciente.html">← Voltar</a><section class="clinical-hero"><span class="eyebrow">CENTRAL DE CUIDADO</span><h1>Notificações e lembretes</h1><p>Resumo de medicamentos e consultas cadastrados.</p></section><section class="data-panel"><h2>Medicamentos</h2><div id="med" class="data-list"></div></section><section class="data-panel"><h2>Consultas</h2><div id="con" class="data-list"></div></section></main><script src="js/api.js"></script><script src="js/auth-guard.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{try{const d=await ZeloAPI.notifications();document.getElementById('med').innerHTML=d.medicamentos.map(x=>`<article class="data-item"><div><b>${x.nome}</b><p>${x.horario||'Horário não informado'}</p></div></article>`).join('')||'<p class="empty-state">Nenhum lembrete.</p>';document.getElementById('con').innerHTML=d.consultas.map(x=>`<article class="data-item"><div><b>${x.tipo||'Consulta'}</b><p>${new Date(x.data_hora).toLocaleString('pt-BR')} · ${x.local||''}</p></div></article>`).join('')||'<p class="empty-state">Nenhuma consulta próxima.</p>'}catch(e){document.getElementById('med').innerHTML=`<p>${e.message}</p>`}});</script><script src="js/ui.js"></script></body></html>
