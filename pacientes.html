<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/prebackend.css"><title>Pacientes — Zelo</title><link rel="stylesheet" href="css/zelo-v2.css"><link rel="stylesheet" href="css/zelo-v3-overrides.css"><link rel="stylesheet" href="css/zelo-v5-contrast.css"></head><body data-role="profissional"><header class="zelo-header"><a class="brand" href="index.html"><img class="zelo-logo-full exact-logo" src="assets/zelo-logo-exact.png" alt="Zelo — Tenha cuidado. Tenha zelo."></a><div class="header-search">⌕ <input placeholder="Buscar paciente..."></div></header><main class="main-content" style="margin-left:0"><section class="page-title compact"><span class="eyebrow">ÁREA PROFISSIONAL</span><h1>Pacientes</h1><p>Lista de pessoas com vínculo ativo.</p></section><div id="list" class="patient-list"></div></main><script src="js/api.js"></script><script src="js/auth-guard.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{try{const p=await ZeloAPI.patients();document.getElementById('list').innerHTML=p.map(x=>`<a class="patient-row" href="paciente-detalhe.html?id=${x.id}"><span class="patient-avatar">${x.nome[0]}</span><span><b>${x.nome}</b><small>${x.email}</small></span><span>›</span></a>`).join('')||'<p class="muted">Nenhum vínculo ativo.</p>'}catch(e){document.getElementById('list').innerHTML=`<p>${e.message}</p>`}});</script><script src="js/ui.js"></script></body></html>
