<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/prebackend.css"><title>Espaço profissional — Zelo</title><link rel="stylesheet" href="css/zelo-v2.css"><link rel="stylesheet" href="css/zelo-v3-overrides.css"><link rel="stylesheet" href="css/zelo-v5-contrast.css"></head><body data-role="profissional"><header class="zelo-header"><a class="brand" href="index.html"><img class="zelo-logo-full exact-logo" src="assets/zelo-logo-exact.png" alt="Zelo — Tenha cuidado. Tenha zelo."></a><div class="header-search">⌕ <input id="globalSearch" placeholder="Buscar no Zelo..."></div><div class="header-actions"><a href="notificacoes.html" class="header-icon">🔔</a><a href="perfis.html" class="avatar">A</a></div></header><div class="app-layout"><aside class="sidebar"><div class="side-title">ESPAÇO PROFISSIONAL</div><a href="profissional.html">⌂ Visão geral</a><a href="pacientes.html">👥 Pacientes</a><a href="historico.html">↺ Histórico clínico</a><a href="consultas.html">◷ Agenda</a><a href="exames.html">▣ Exames</a><a href="procedimentos.html">✚ Procedimentos</a><a href="orientacoes.html">✦ Orientações</a><a href="configuracoes.html">⚙ Configurações</a></aside><main class="main-content"><section class="page-title compact"><span class="eyebrow">ÁREA PROFISSIONAL</span><h1>Visão clínica</h1><p>Pacientes aparecem somente quando existe vínculo autorizado.</p></section><div class="summary-grid" id="stats"></div><section class="panel"><div class="panel-head"><h2>Meus pacientes</h2><a href="pacientes.html">Abrir lista</a></div><div id="patientList" class="patient-list"></div></section></main></div><script src="js/api.js"></script><script src="js/auth-guard.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{try{const p=await ZeloAPI.patients();document.getElementById('stats').innerHTML=[[p.length,'Pacientes em acompanhamento'],['—','Atendimentos hoje'],['—','Laudos para revisar'],['—','Retornos próximos']].map(x=>`<div class="summary-card"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('');document.getElementById('patientList').innerHTML=p.map(x=>`<a class="patient-row" href="paciente-detalhe.html?id=${x.id}"><span class="patient-avatar">${x.nome[0]}</span><span><b>${x.nome}</b><small>${x.email}</small></span><span>›</span></a>`).join('')||'<p class="muted">Nenhum paciente autorizado ainda. Peça ao paciente para aprovar seu vínculo.</p>'}catch(e){document.getElementById('patientList').innerHTML=`<p class="muted">${e.message}</p>`}});</script><script src="js/ui.js"></script></body></html>
