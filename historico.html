<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Histórico clínico — Zelo</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/data.css"><link rel="stylesheet" href="css/zelo-v2.css"><link rel="stylesheet" href="css/zelo-v3-overrides.css"><link rel="stylesheet" href="css/zelo-v5-contrast.css"></head><body><div class="accessibility-bar"><button id="increaseFont">A+</button><button id="decreaseFont">A−</button><button id="highContrast">◐ Contraste</button><button id="readPage">🔊 Ler página</button></div><main class="clinical-page"><a class="back-link" href="paciente.html">← Voltar</a><section class="clinical-hero"><div><span class="eyebrow">LINHA DO CUIDADO</span><h1>Histórico clínico</h1><p>Consultas, exames, medicamentos e evolução reunidos em uma linha do tempo.</p></div></section><div id="pageMessage" class="page-message" hidden></div><section class="summary-grid" id="summary"></section><section class="data-panel" id="evolutionPanel"><h2>Registrar evolução</h2><p>Profissionais podem registrar observações clínicas para manter a continuidade do cuidado.</p><form id="evolutionForm" class="data-form"><label>Data e hora<input name="data_hora" type="datetime-local" required></label><label>Tipo<select name="tipo"><option>Consulta</option><option>Acompanhamento</option><option>Procedimento</option><option>Orientação</option></select></label><label class="full">Evolução<textarea name="descricao" required></textarea></label><div class="full"><button class="primary-data-btn">Salvar evolução</button></div></form></section><section class="data-panel"><h2>Linha do tempo</h2><div id="timeline" class="timeline"></div></section></main><script src="js/api.js"></script><script src="js/auth-guard.js"></script><script src="js/clinical.js"></script><script>
document.addEventListener('DOMContentLoaded',async()=>{const u=ZeloAPI.getUser();if(u?.tipo!=='profissional')document.getElementById('evolutionPanel').style.display='none';const target=new URLSearchParams(location.search).get('paciente_id');const [meds0,cons0,exams0,ev0]=await Promise.all([ZeloAPI.list('medicamentos'),ZeloAPI.list('consultas'),ZeloAPI.list('exames'),ZeloAPI.list('evolucoes')]);const filter=a=>target?a.filter(x=>String(x.paciente_id)===String(target)):a;const meds=filter(meds0),cons=filter(cons0),exams=filter(exams0),ev=filter(ev0);document.getElementById('summary').innerHTML=[[meds.length,'medicações'],[cons.length,'consultas'],[exams.length,'exames'],[ev.length,'evoluções']].map(x=>`<div class="summary-card"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('');const events=[...meds.map(x=>({d:0,l:'Medicamento',t:x.nome,p:`${x.dose||''} · ${x.horario||''}`,s:'Ativo'})),...cons.map(x=>({d:new Date(x.data_hora),l:'Consulta',t:x.tipo||'Consulta',p:`${ZeloClinical.fmtDateTime(x.data_hora)} · ${x.local||''}`,s:x.status})),...exams.map(x=>({d:new Date(x.data_realizacao||0),l:'Exame',t:x.nome,p:ZeloClinical.fmtDate(x.data_realizacao),s:x.status})),...ev.map(x=>({d:new Date(x.data_hora),l:'Evolução',t:x.tipo||'Evolução',p:x.descricao,s:'Registrada'}))].sort((a,b)=>new Date(b.d)-new Date(a.d));document.getElementById('timeline').innerHTML=events.map(x=>`<article class="timeline-card"><div class="timeline-meta">${ZeloClinical.esc(x.l)}</div><h3>${ZeloClinical.esc(x.t)}</h3><p>${ZeloClinical.esc(x.p)}</p><span class="status-pill">${ZeloClinical.esc(x.s||'')}</span></article>`).join('')||'<p class="empty-state">Ainda não há registros.</p>';document.getElementById('evolutionForm')?.addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget).entries());if(target)d.paciente_id=target;try{await ZeloAPI.create('evolucoes',d);ZeloClinical.msg('Evolução registrada.');location.reload()}catch(err){ZeloClinical.msg(err.message,'error')}})});
</script><script src="js/ui.js"></script></body></html>
