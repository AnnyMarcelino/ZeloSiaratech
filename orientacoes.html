<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/data.css"><title>Orientações — Zelo</title><link rel="stylesheet" href="css/zelo-v2.css"><link rel="stylesheet" href="css/zelo-v3-overrides.css"><link rel="stylesheet" href="css/zelo-v5-contrast.css"></head><body><main class="clinical-page"><a class="back-link" href="paciente.html">← Voltar</a><section class="clinical-hero"><span class="eyebrow">CUIDADO CONTÍNUO</span><h1>Orientações</h1><p>Instruções registradas pela equipe responsável.</p></section><section class="data-panel" id="formPanel"><h2>Nova orientação</h2><form id="form" class="data-form"><label>Paciente ID<input name="paciente_id" required></label><label>Título<input name="titulo" required></label><label class="full">Conteúdo<textarea name="conteudo" required></textarea></label><div class="full"><button class="primary-data-btn">Salvar orientação</button></div></form></section><section class="data-panel"><div id="list" class="data-list"></div></section></main><script src="js/api.js"></script><script src="js/auth-guard.js"></script><script src="js/clinical.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{if(ZeloAPI.getUser()?.tipo!=='profissional')document.getElementById('formPanel').style.display='none';ZeloClinical.init('orientacoes',{listId:'list',formId:'form',card:x=>`<article class="data-item"><div><h3>${ZeloClinical.esc(x.titulo)}</h3><p>${ZeloClinical.esc(x.conteudo)}</p></div></article>`})});</script><script src="js/ui.js"></script></body></html>
