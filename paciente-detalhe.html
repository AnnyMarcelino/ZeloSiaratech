<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/prebackend.css"><title>Paciente — Zelo</title><link rel="stylesheet" href="css/zelo-v2.css"><link rel="stylesheet" href="css/zelo-v3-overrides.css"><link rel="stylesheet" href="css/zelo-v5-contrast.css"></head><body data-role="profissional"><main class="main-content" style="margin-left:0"><a class="back-link" href="pacientes.html">← Voltar</a><section class="page-title compact"><span class="eyebrow">PRONTUÁRIO COMPARTILHADO</span><h1 id="name">Carregando...</h1><p id="email"></p></section><div class="summary-grid" id="stats"></div><section class="panel"><div class="panel-head"><h2>Registros</h2><a id="history" href="#">Abrir histórico</a></div><div id="content"></div></section></main><script src="js/api.js"></script><script src="js/auth-guard.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const id=new URLSearchParams(location.search).get('id');if(!id)return;try{const ps=await ZeloAPI.patients();const p=ps.find(x=>String(x.id)===String(id));if(!p)throw new Error('Paciente não encontrado ou sem acesso.');document.getElementById('name').textContent=p.nome;document.getElementById('email').textContent=p.email;const [m,c,e,v]=await Promise.all([ZeloAPI.list('medicamentos'),ZeloAPI.list('consultas'),ZeloAPI.list('exames'),ZeloAPI.list('evolucoes')]);const mine=a=>a.filter(x=>String(x.paciente_id)===String(id));document.getElementById('stats').innerHTML=[[mine(m).length,'Medicamentos'],[mine(c).length,'Consultas'],[mine(e).length,'Exames'],[mine(v).length,'Evoluções']].map(x=>`<div class="summary-card"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('');document.getElementById('content').innerHTML='<p>Dados clínicos disponíveis conforme as permissões do vínculo.</p>';document.getElementById('history').href=`historico.html?paciente_id=${id}`}catch(err){document.getElementById('name').textContent=err.message}});</script><script src="js/ui.js"></script></body></html>
