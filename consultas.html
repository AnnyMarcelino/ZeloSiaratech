<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consultas — Zelo</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/data.css"><link rel="stylesheet" href="css/zelo-v2.css"><link rel="stylesheet" href="css/zelo-v3-overrides.css"><link rel="stylesheet" href="css/zelo-v5-contrast.css"></head><body><div class="accessibility-bar"><button id="increaseFont">A+</button><button id="decreaseFont">A−</button><button id="highContrast">◐ Contraste</button><button id="readPage">🔊 Ler página</button></div><main class="clinical-page"><a class="back-link" href="paciente.html">← Voltar</a><section class="clinical-hero"><div><span class="eyebrow">AGENDA DO CUIDADO</span><h1>Consultas</h1><p>Acompanhe retornos, consultas e atendimentos programados.</p></div></section><div id="pageMessage" class="page-message" hidden></div><section class="data-panel"><h2>Adicionar consulta</h2><form id="form" class="data-form"><label>Data e hora<input name="data_hora" type="datetime-local" required></label><label>Tipo<input name="tipo" placeholder="Retorno"></label><label>Local<input name="local"></label><label>Profissional<input name="profissional"></label><label>Status<select name="status"><option value="agendada">Agendada</option><option value="confirmada">Confirmada</option><option value="realizada">Realizada</option><option value="cancelada">Cancelada</option></select></label><label class="full">Observações<textarea name="observacoes"></textarea></label><div class="full"><button class="primary-data-btn">Salvar consulta</button></div></form></section><section class="data-panel"><h2>Registros</h2><div id="list" class="data-list"></div></section></main><script src="js/api.js"></script><script src="js/auth-guard.js"></script><script src="js/clinical.js"></script><script>document.addEventListener('DOMContentLoaded',()=>ZeloClinical.init('consultas',{listId:'list',formId:'form',card:x=>`<article class="data-item"><div><h3>${ZeloClinical.esc(x.tipo||'Consulta')}</h3><p>${ZeloClinical.fmtDateTime(x.data_hora)} · ${ZeloClinical.esc(x.local||'')}</p><small>${ZeloClinical.esc(x.profissional||'')} · ${ZeloClinical.esc(x.status||'')}</small></div><button class="delete-data" data-delete="${x.id}">Remover</button></article>`}));</script><script src="js/ui.js"></script></body></html>
