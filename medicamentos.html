<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medicamentos — Zelo</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/data.css"><link rel="stylesheet" href="css/zelo-v2.css"><link rel="stylesheet" href="css/zelo-v3-overrides.css"><link rel="stylesheet" href="css/zelo-v5-contrast.css"></head><body><div class="accessibility-bar"><button id="increaseFont">A+</button><button id="decreaseFont">A−</button><button id="highContrast">◐ Contraste</button><button id="readPage">🔊 Ler página</button></div><main class="clinical-page"><a class="back-link" href="paciente.html">← Voltar</a><section class="clinical-hero"><div><span class="eyebrow">MEU TRATAMENTO</span><h1>Medicamentos</h1><p>Organize horários, doses e frequência do tratamento.</p></div></section><div id="pageMessage" class="page-message" hidden></div><section class="data-panel"><h2>Adicionar medicamento</h2><form id="form" class="data-form"><label>Nome<input name="nome" required></label><label>Horário<input name="horario" type="time" required></label><label>Dose<input name="dose" required></label><label>Frequência<input name="frequencia" placeholder="1x ao dia"></label><label class="full">Observações<textarea name="observacoes"></textarea></label><div class="full"><button class="primary-data-btn">Salvar medicamento</button></div></form></section><section class="data-panel"><h2>Registros</h2><div id="list" class="data-list"></div></section></main><script src="js/api.js"></script><script src="js/auth-guard.js"></script><script src="js/clinical.js"></script><script>document.addEventListener('DOMContentLoaded',()=>ZeloClinical.init('medicamentos',{listId:'list',formId:'form',card:x=>`<article class="data-item"><div><h3>${ZeloClinical.esc(x.nome)}</h3><p>${ZeloClinical.esc(x.dose||'')} · ${ZeloClinical.esc(x.horario||'')} · ${ZeloClinical.esc(x.frequencia||'')}</p><small>${ZeloClinical.esc(x.observacoes||'')}</small></div><button class="delete-data" data-delete="${x.id}">Remover</button></article>`}));</script><script src="js/ui.js"></script></body></html>
