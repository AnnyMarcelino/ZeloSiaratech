<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exames — Zelo</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/data.css"><link rel="stylesheet" href="css/zelo-v2.css"><link rel="stylesheet" href="css/zelo-v3-overrides.css"><link rel="stylesheet" href="css/zelo-v5-contrast.css"></head><body><div class="accessibility-bar"><button id="increaseFont">A+</button><button id="decreaseFont">A−</button><button id="highContrast">◐ Contraste</button><button id="readPage">🔊 Ler página</button></div><main class="clinical-page"><a class="back-link" href="paciente.html">← Voltar</a><section class="clinical-hero"><div><span class="eyebrow">RESULTADOS</span><h1>Exames</h1><p>Centralize exames, resultados e laudos para continuidade do cuidado.</p></div></section><div id="pageMessage" class="page-message" hidden></div><section class="data-panel"><h2>Adicionar exame</h2><form id="form" class="data-form"><label>Exame<input name="nome" required></label><label>Data<input name="data_realizacao" type="date"></label><label>Status<select name="status"><option>Laudo disponível</option><option>Aguardando resultado</option><option>Revisar com profissional</option></select></label><label class="full">Laudo<textarea name="laudo"></textarea></label><label class="full">Observações<textarea name="observacoes"></textarea></label><div class="full"><button class="primary-data-btn">Salvar exame</button></div></form></section><section class="data-panel"><h2>Registros</h2><div id="list" class="data-list"></div></section></main><script src="js/api.js"></script><script src="js/auth-guard.js"></script><script src="js/clinical.js"></script><script>document.addEventListener('DOMContentLoaded',()=>ZeloClinical.init('exames',{listId:'list',formId:'form',card:x=>`<article class="data-item"><div><h3>${ZeloClinical.esc(x.nome)}</h3><p>${ZeloClinical.fmtDate(x.data_realizacao)} · ${ZeloClinical.esc(x.status||'')}</p><small>${ZeloClinical.esc(x.laudo||x.observacoes||'')}</small></div><button class="delete-data" data-delete="${x.id}">Remover</button></article>`}));</script><script src="js/ui.js"></script></body></html>
