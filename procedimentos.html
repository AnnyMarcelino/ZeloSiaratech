<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/data.css"><title>Procedimentos — Zelo</title><link rel="stylesheet" href="css/zelo-v2.css"><link rel="stylesheet" href="css/zelo-v3-overrides.css"><link rel="stylesheet" href="css/zelo-v5-contrast.css"></head><body><main class="clinical-page"><a class="back-link" href="profissional.html">← Voltar</a><section class="clinical-hero"><span class="eyebrow">CONTINUIDADE DO CUIDADO</span><h1>Procedimentos</h1><p>Registros realizados pela equipe profissional.</p></section><section class="data-panel"><form id="form" class="data-form"><label>Paciente ID<input name="paciente_id" required></label><label>Nome<input name="nome" required></label><label>Data e hora<input name="data_hora" type="datetime-local"></label><label>Status<input name="status" placeholder="Realizado"></label><label class="full">Descrição<textarea name="descricao"></textarea></label><div class="full"><button class="primary-data-btn">Registrar procedimento</button></div></form></section><section class="data-panel"><h2>Registros</h2><div id="list" class="data-list"></div></section></main><script src="js/api.js"></script><script src="js/auth-guard.js"></script><script src="js/clinical.js"></script><script>document.addEventListener('DOMContentLoaded',()=>ZeloClinical.init('procedimentos',{listId:'list',formId:'form',card:x=>`<article class="data-item"><div><h3>${ZeloClinical.esc(x.nome)}</h3><p>${ZeloClinical.fmtDateTime(x.data_hora)} · ${ZeloClinical.esc(x.status||'')}</p></div></article>`}));</script><script src="js/ui.js"></script></body></html>
